name: Catalog health

# The catalog's health each night, for the Catalog team (studio/plans/five-teams.md):
# units with no real label, items with no place, additions without a sefer,
# duplicate printings and shelves out of order, counted by
# `chassidushub catalog-health` from the public catalog snapshot
# (docs/catalog-snapshot.md). Read-only: no database, no secret, nothing
# written to the catalog. The counts and the worst of each go into one open
# issue, "Catalog health (nightly)", edited in place (no notification each
# night), with each count's change since the night before; every item behind
# every count is in the run's report.json.
on:
  schedule:
    # 07:40 UTC: the small hours in New York, after the day's approvals.
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-health
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      API: https://api.chassidushub.org
      TITLE: Catalog health (nightly)
    steps:
      - name: Is the snapshot served?
        id: served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$API/v1/catalog/manifest.json" || true)
          if [ "$code" = "200" ]; then echo "yes=1" >> "$GITHUB_OUTPUT"; else echo "::notice::The catalog snapshot is not served yet ($code): nothing to count."; fi
      - uses: actions/checkout@v7
        if: steps.served.outputs.yes
      - uses: actions/setup-node@v7
        if: steps.served.outputs.yes
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.served.outputs.yes
        run: npm ci --no-audit --no-fund
      - name: Last night's counts
        if: steps.served.outputs.yes
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          echo "ISSUE=$number" >> "$GITHUB_ENV"
          if [ -n "$number" ]; then
            gh issue view "$number" --json body --jq .body | sed -n 's/^<!-- catalog-health \(.*\) -->$/\1/p' > previous.json
          fi
      - name: Count
        if: steps.served.outputs.yes
        run: npm run chassidushub -- catalog-health --from "$API" --out health --previous previous.json
      - name: Into the issue
        if: steps.served.outputs.yes
        run: |
          {
            cat health/report.md
            echo
            echo "Every item behind every count: report.json in [the run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Made by .github/workflows/catalog-health.yml; edited each night."
            echo
            echo "<!-- catalog-health $(jq -c '{counts}' health/report.json) -->"
          } > body.md
          cat health/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md --label team:catalog || gh issue create --title "$TITLE" --body-file body.md
          fi
      - uses: actions/upload-artifact@v4
        if: steps.served.outputs.yes
        with:
          name: catalog-health
          path: health/
          retention-days: 30

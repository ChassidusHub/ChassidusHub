name: Take machine translations off

# Takes machine translations of transcripts off the catalog with
# `chassidushub translations-remove`, keeping the transcripts. A
# translation a person checked or fixed is left, and listed.
#
# Needs the repository secret DATABASE_URL.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Only this engine's translations (empty for every machine translation)
        default: chassidushub-translate-v1
        required: false
      steward:
        description: The steward who approves taking them off
        default: steward
        required: true
      dry_run:
        description: Only count what it would take off
        type: boolean
        default: true

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check it is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the repository secret DATABASE_URL (see docs/deploy.md)."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Take them off
        env:
          ENGINE: ${{ inputs.engine }}
          STEWARD: ${{ inputs.steward }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          npm run chassidushub -- migrate
          args=(--approve-as "$STEWARD")
          if [ -n "$ENGINE" ]; then args+=(--engine "$ENGINE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npm run chassidushub -- translations-remove "${args[@]}"

name: CI

on:
  # Pull requests only, not again on main after the merge, while Actions minutes are limited (private repository).
  # A draft is not checked: Actions minutes go to pull requests that are ready (studio/briefs/qa.md).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      www: ${{ steps.www.outputs.www }}
    steps:
      # Sichos Kodesh, the OCR engines and the docs have none of these checks: a pull request changing only them skips the rest.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!sichos-kodesh/**'
              - '!ocr/**'
              - '!docs/**'
              - '!design/**'
              - '!**/*.md'
              - '!.github/workflows/sk-*.yml'
      # The new site's browser tests, when it or what it is built from changed (any one of these).
      - uses: dorny/paths-filter@v3
        id: www
        with:
          filters: |
            www:
              - 'apps/www/**'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  types:
    name: Types and schemas
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run catalog:check
      # The approval gate's own decisions (approval.yml).
      - run: node --test .github/scripts/*.test.cjs

  tests:
    name: Tests (PGlite) ${{ matrix.shard }}/3
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The tests were nine of the ten minutes in one job; split three ways, side by side.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site's tests render the built server.
      - run: npm run build:web
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  www:
    # The new site in a real browser: the page budgets, accessibility and a smoke test of every page (apps/www/e2e).
    name: New site in a browser
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.www == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:www
      - run: npx playwright install --with-deps chromium
        working-directory: apps/www
      - run: npx playwright test
        working-directory: apps/www

  check:
    # The name pull requests have always waited on: green when every job above passed or had nothing to check.
    name: Types, tests and schemas (PGlite)
    needs: [changes, types, tests, www]
    # Skipped with the rest on a draft, so a draft never shows a green check it did not earn.
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."

  postgres:
    name: Tests on Postgres 16
    # By hand only while Actions minutes are limited; the PGlite job above runs the same tests on every pull request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chassidushub
          POSTGRES_PASSWORD: chassidushub
          POSTGRES_DB: chassidushub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chassidushub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHASSIDUSHUB_TEST_DATABASE_URL: postgres://chassidushub:chassidushub@localhost:5432/chassidushub_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # One file at a time: the files share the test database.
      - run: npx vitest run --no-file-parallelism

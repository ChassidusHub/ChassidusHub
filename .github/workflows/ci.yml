name: CI

on:
  # Pull requests only, not again on main after the merge, while Actions minutes are limited (private repository).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and schemas (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm test
      - run: npm run catalog:check

  postgres:
    name: Tests on Postgres 16
    # By hand only while Actions minutes are limited; the PGlite job above runs the same tests on every pull request.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chassidushub
          POSTGRES_PASSWORD: chassidushub
          POSTGRES_DB: chassidushub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chassidushub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHASSIDUSHUB_TEST_DATABASE_URL: postgres://chassidushub:chassidushub@localhost:5432/chassidushub_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # One file at a time: the files share the test database.
      - run: npx vitest run --no-file-parallelism

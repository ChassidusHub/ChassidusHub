name: Catalog API bundle

# api/index.js (the Vercel function) is a COMMITTED esbuild bundle: Vercel
# only discovers function entrypoints that exist in the source tree, so a
# build-time-only api/index.js is never picked up and the API 404s.
# This workflow rebuilds the bundle on every push to main touching the
# service (or the catalog it embeds) and commits it, so the deployed
# function always matches the source. Never edit api/index.js by hand.

on:
  push:
    branches: [main]
    paths:
      - 'services/catalog-api/**'
      - 'packages/catalog/**'
      - 'packages/kvius-engine/**'
      - '.github/workflows/catalog-api-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    # The bot's own commits carry [skip ci]; don't loop on them.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the API (release data + function bundle)
        run: npm run build -w @sichos-kodesh/kvius-engine -w @sichos-kodesh/catalog-api

      - name: Commit the bundle if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- services/catalog-api/api/index.js; then
            echo "bundle unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/catalog-api/api/index.js
            git commit -m "catalog-api: rebuild function bundle [skip ci]"
            git push
          fi

name: Android APK

# Builds apps/mobile as a plain Gradle Android project (bare React Native,
# no Expo/EAS - see docs/PLANNING.md's "Mobile App" section for why) and
# publishes a debug APK to a floating "latest-dev-build" GitHub Release on
# every push, so there's always one stable link to download and sideload
# the newest build without a Mac, a paid Apple account, or an Expo account.

on:
  push:
    branches:
      - claude/kvius-engine-dev-qp43u7
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm install

      # apps/mobile depends on @sichos-kodesh/kvius-engine and
      # @sichos-kodesh/catalog via their built dist/ output (package.json
      # "main"/"types" point there), not their TypeScript source directly -
      # same as any consumer of these packages, in or out of this repo.
      - name: Build workspace library packages
        run: |
          npm run build --workspace=@sichos-kodesh/kvius-engine
          npm run build --workspace=@sichos-kodesh/mafteiach-index
          npm run build --workspace=@sichos-kodesh/catalog

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Publish to the latest-dev-build release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev-build
          name: Latest dev build
          body: |
            Automatically rebuilt from ${{ github.sha }} on every push - always the newest debug build, not tied to a version number.
            Sideload this on an Android device (enable "install from unknown sources" for your browser/file manager first).
          prerelease: true
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

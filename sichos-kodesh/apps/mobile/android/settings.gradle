// This app lives at apps/mobile in an npm workspace monorepo, so
// dependencies (including @react-native/gradle-plugin) are hoisted to the
// repo root's node_modules, not apps/mobile/node_modules - the CLI's
// default single-package-relative path (`../node_modules/...`) doesn't
// reach it. Adjusted to the real hoisted location instead.
pluginManagement { includeBuild("../../../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'SichosKodeshMobile'
include ':app'
includeBuild('../../../node_modules/@react-native/gradle-plugin')

# The new site (apps/www) on its own Worker, beside the old one (apps/web), until
# the switch-over gives it chassidushub.org. Cloudflare builds and deploys it from
# main (Workers Builds; docs/deploy.md).
name = "chassidushub-www"
main = "server/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# The beta address, hidden from search engines: only chassidushub.org itself is indexed (app/lib/site.ts).
routes = [{ pattern = "new.chassidushub.org", custom_domain = true }]

# The shared packages are used from source, as in vite.config.ts, so the deploy needs nothing built first.
[alias]
"@chassidushub/client" = "../../packages/client/src/index.ts"
"@chassidushub/model" = "../../packages/model/src/index.ts"
"@chassidushub/hebrew" = "../../packages/hebrew/src/index.ts"

[observability]
enabled = true

# build/client: the built files, answered before the Worker runs; public/_headers
# gives them their cache and noindex headers.
[assets]
directory = "build/client"
binding = "ASSETS"

# The API, reached inside Cloudflare without a public round trip; API_URL is its
# public address, used only when the binding is absent (app/lib/api.ts).
[[services]]
binding = "API"
service = "chassidushub-api"

# The public bucket, where showcases are kept (showcases/<token>.json), the same
# files the old site wrote, so links already handed out keep working; and where
# the API writes the catalog snapshot (catalog/…), handed to the browser at
# /_/catalog/… for its clicks (server/catalog.ts; CATALOG_SNAPSHOT = "off" hands none).
[[r2_buckets]]
binding = "FILES_PUBLIC"
bucket_name = "chassidushub-public"

# Cloudflare's Workers cache (server/edge.ts; docs/operations.md, "The new site's pages at the edge"). The
# default entrypoint runs on every request and is never cached: it sends pages for someone not signed in on to
# CachedPage, which the cache sits in front of, tiered, for as long as each page's Cache-Control says. The kept
# pages are shared by every deploy (cross_version_cache) and told apart by build instead (edge.ts, forEdge), so a
# merge that changes nothing a page shows keeps them warm. The API forgets the pages a change is about
# (services/api/src/pages.ts) through CachedPage's `forget`.
# Off for the Worker as a whole; on for CachedPage alone, below.
[cache]
enabled = false
cross_version_cache = true

[exports.default]
type = "worker"

[exports.default.cache]
enabled = false

[exports.CachedPage]
type = "worker"

[exports.CachedPage.cache]
enabled = true

[vars]
API_URL = "https://api.chassidushub.org"

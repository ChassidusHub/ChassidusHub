<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Phone words suggestion</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&amp;family=Noto+Sans+Hebrew:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
</style>
</helmet>
<div dir="rtl" lang="he" style="width: 390px; height: 844px; box-sizing: border-box; background: #f7f3ea; color: #1f1a13; font-family: 'Noto Sans Hebrew', sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px;">
    <a href="PhoneSuggestions.dc.html" aria-label="חזרה" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 7l5 5-5 5"/></svg></a>
    <span style="flex-grow: 1; font-size: 13px; color: #6b6253;">הצעות</span>
    <button type="button" aria-label="פרטים ועוד" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1f1a13; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg></button>
  </header>

  <div style="flex-grow: 1; overflow-y: auto; padding: 0 16px 180px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b6253;"><span style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: #e3eddc; color: #2f6b3f; font-weight: 600;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #2f6b3f;"></span>פתוחה</span>[שם המציע] · [לפני יום]</span>
      <h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.35;">תמלול [השיעור בתניא]: 2 מילים תוקנו, פסקה אחת נבדקה</h1>
      <span style="font-size: 13px; color: #4e463a;">משנה את המילים בכל תצוגה ובחיפוש. לא משנה את ההקלטה.</span>
    </div>

    <sc-for list="{{changes}}" as="c" hint-placeholder-count="3">
      <div style="background: #fffdf8; border: 1px solid #dcd2bf; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; opacity: {{c.opacity}};">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b6253;"><span style="flex-grow: 1;">{{c.where}}</span><button type="button" onClick="{{c.hear}}" style="height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid #dcd2bf; background: #fffdf8; font: 500 12px 'Noto Sans Hebrew', sans-serif; color: #1f1a13; display: flex; align-items: center; gap: 4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>לשמוע</button></div>
        <sc-if value="{{c.isWords}}" hint-placeholder-val="{{true}}">
          <span style="font-family: 'Frank Ruhl Libre', serif; font-size: 20px; line-height: 1.7;"><span style="color: #6b6253;">{{c.before}}</span> <s style="color: #9a3322; background: #f4ddd6;">{{c.del}}</s> <span style="color: #23532d; background: #dfecd8; padding: 0 2px;">{{c.ins}}</span> <span style="color: #6b6253;">{{c.after}}</span></span>
        </sc-if>
        <sc-if value="{{c.isCheck}}" hint-placeholder-val="{{false}}">
          <span style="display: flex; align-items: center; gap: 8px; color: #2f6b3f; font-weight: 500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l4.5 4.5L19 7"/></svg>הפסקה כולה נשמעה ונמצאה נכונה</span>
        </sc-if>
        <sc-if value="{{c.open}}" hint-placeholder-val="{{false}}">
          <span style="padding: 10px 12px; border-radius: 8px; background: #f7f3ea; font-family: 'Frank Ruhl Libre', serif; font-size: 17px; line-height: 1.7; color: #4e463a;">{{c.full}}</span>
        </sc-if>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button type="button" onClick="{{c.toggleOpen}}" style="height: 32px; padding: 0; border: 0; background: transparent; color: #8a2c1e; font: 500 13px 'Noto Sans Hebrew', sans-serif;">{{c.openLabel}}</button>
          <span style="flex-grow: 1;"></span>
          <div role="radiogroup" aria-label="להשאיר או להסיר" style="display: flex; padding: 3px; gap: 2px; background: #ece5d6; border-radius: 8px;">
            <button type="button" role="radio" aria-checked="{{c.keep}}" onClick="{{c.setKeep}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; font: 600 12px 'Noto Sans Hebrew', sans-serif; background: {{c.keepBg}}; color: {{c.keepColor}};">להשאיר</button>
            <button type="button" role="radio" aria-checked="{{c.remove}}" onClick="{{c.setRemove}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; font: 600 12px 'Noto Sans Hebrew', sans-serif; background: {{c.removeBg}}; color: {{c.removeColor}};">להסיר</button>
          </div>
        </div>
      </div>
    </sc-for>

    <button type="button" style="align-self: flex-start; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dcd2bf; background: #fffdf8; font: 500 13px 'Noto Sans Hebrew', sans-serif; color: #1f1a13;">תגובות · 0</button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fffdf8; border-top: 1px solid #dcd2bf; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px;">
    <sc-if value="{{sendingBack}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="sb-note" style="font-size: 13px; font-weight: 500;">למה להחזיר? (שורה אחת)</label>
        <input id="sb-note" placeholder="למשל: בהקלטה נשמע ״[מילה]״" style="height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid #c8bba3; font: 14px 'Noto Sans Hebrew', sans-serif; color: #1f1a13; background: #fffdf8;">
      </div>
    </sc-if>
    <span style="font-size: 12px; color: #6b6253;">{{summary}}</span>
    <div style="display: flex; gap: 8px;">
      <button type="button" onClick="{{approve}}" style="flex-grow: 1; height: 54px; border-radius: 12px; border: 0; background: {{approveBg}}; color: #fffdf8; font: 600 16px 'Noto Sans Hebrew', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12l4.5 4.5L19 7"/></svg>{{approveLabel}}</button>
      <button type="button" onClick="{{sendBack}}" style="height: 54px; padding: 0 16px; border-radius: 12px; border: 1px solid #c8bba3; background: #fffdf8; color: #1f1a13; font: 500 14px 'Noto Sans Hebrew', sans-serif;">{{backLabel}}</button>
    </div>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 14px; right: 14px; top: 60px; min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; background: #1f1a13; color: #f7f3ea; font-size: 14px;">{{done}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { keep: [true, true, true], open: [false, false, false], sendingBack: false, done: '' };
  }
  flash(t) { this.setState({ done: t }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ done: '' }), 3000); }
  renderVals() {
    const s = this.state;
    const data = [
      { where: 'פסקה 1 · [0:04]', kind: 'words', before: 'כאן יופיעו מילות הפסקה', del: '[מילה שגויה]', ins: '[המילה הנכונה]', after: 'שאחריהן ממשיכות באותה', full: 'במקום הטקסט האמיתי כאן יופיעו מילות הפסקה כפי שנאמרו בהקלטה או שנדפסו' },
      { where: 'פסקה 1', kind: 'check', full: 'במקום הטקסט האמיתי כאן יופיעו מילות הפסקה כפי שנאמרו בהקלטה או שנדפסו' },
      { where: 'פסקה 2 · [0:11]', kind: 'words', before: 'במקום הטקסט האמיתי', del: '[מילה]', ins: '[מילה]', after: 'בהקלטה או שנדפסו', full: 'מילים לדוגמה בלבד בשורה הבאה שוב במקום הטקסט האמיתי כאן יופיעו' }
    ];
    const kept = s.keep.filter(Boolean).length;
    const changes = data.map((d, i) => {
      const k = s.keep[i];
      const set = (v) => { const keep = s.keep.slice(); keep[i] = v; this.setState({ keep: keep }); };
      return Object.assign({}, d, {
        isWords: d.kind === 'words', isCheck: d.kind === 'check',
        open: s.open[i], openLabel: s.open[i] ? 'הסתרת הפסקה' : 'הפסקה כולה',
        toggleOpen: () => { const open = s.open.slice(); open[i] = !open[i]; this.setState({ open: open }); },
        keep: k, remove: !k, opacity: k ? '1' : '0.55',
        keepBg: k ? '#fffdf8' : 'transparent', keepColor: k ? '#2f6b3f' : '#4e463a',
        removeBg: !k ? '#fffdf8' : 'transparent', removeColor: !k ? '#9a3322' : '#4e463a',
        setKeep: () => set(true), setRemove: () => set(false),
        hear: () => this.flash('מנגן את הקטע, מעט לפני השינוי')
      });
    });
    return {
      changes: changes,
      summary: kept === data.length ? 'כל 3 השינויים יאושרו יחד.' : kept + ' יאושרו, ' + (data.length - kept) + ' יוחזרו למציע עם הערה.',
      approveLabel: kept === data.length ? 'אישור' : 'אישור ' + kept,
      approveBg: kept ? '#8a2c1e' : '#c8bba3',
      approve: () => { if (kept) this.flash('אושר. השינויים עלו לאתר ונשמרו בהיסטוריה'); },
      sendingBack: s.sendingBack,
      backLabel: s.sendingBack ? 'שליחה' : 'להחזיר',
      sendBack: () => { if (s.sendingBack) { this.setState({ sendingBack: false }); this.flash('הוחזר למציע עם ההערה'); } else this.setState({ sendingBack: true }); },
      done: s.done
    };
  }
}
</script>
</body>
</html>

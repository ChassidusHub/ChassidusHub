<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="הורדת התוועדויות, הנחות והקלטות לטלפון, כחבילה אחת חתומה." />
    <title>ChassidusHub · חבילות לטלפון</title>
    <script>
      // The language chosen on this browser (src/i18n.tsx), before the first paint: no flash of the other direction.
      try {
        if (localStorage.getItem('chassidushub-pack-lang') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

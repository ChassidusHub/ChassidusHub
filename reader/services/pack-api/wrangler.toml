name = "sichos-kodesh-pack-api"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# On the chassidushub.org account. The app server and the packs: the catalog API
# (api.chassidushub.org/v1/app) reaches it over a service binding, the release workflow
# and the download site at its own address.
workers_dev = true
routes = [{ pattern = "packs.chassidushub.org", custom_domain = true }]

# The published archive (sk-pack publish, then rclone sync to R2).
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "sichos-kodesh-archive"

# The signing key is a secret, never in this file:
#   wrangler secret put PACK_SIGNING_KEY   (the JSON of <archive>/keys/pack-signing.json)
